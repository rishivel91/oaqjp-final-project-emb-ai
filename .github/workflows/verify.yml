name: Verify emotion detection project

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pwd
          python3 -m unittest test_emotion_detection.py -v
      - name: Run Pylint on Flask server
        run: |
          pwd
          python3 -m pylint server.py
      - name: Test Watson endpoint connectivity and output
        run: |
          pwd
          python3 - <<'PY'
          from EmotionDetection.emotion_detection import emotion_detector
          for phrase in ["I am really mad about this", "I am glad this happened", "I am very angry"]:
              try:
                  print(f"INPUT: {phrase!r}")
                  print(f"OUTPUT: {emotion_detector(phrase)!r}")
              except Exception as exc:
                  print(f"LIVE_WATSON_ERROR: {type(exc).__name__}: {exc}")
          PY
      - name: Capture genuine blank-input deployment screenshot
        run: |
          python3 -m pip install selenium
          python3 scripts/capture_error_screenshot.py
      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-error-screenshot
          path: 7c_error_handling_interface.png
